name: CI

"on":
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  qa-agent:
    name: QA Agent
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install Python validators
        run: python -m pip install yamllint
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Check custom card syntax
        run: node --check ha-kia-connect-dashboard.js
      - name: Test charger controls
        run: node scripts/check_charger_controls.js
      - name: Test frontend rendering guards
        run: node scripts/check_frontend_rendering.js
      - name: Validate required structure
        run: python scripts/check_required_structure.py
      - name: Validate release version consistency
        run: |
          python scripts/check_version_consistency.py
          python -m unittest scripts/test_version_consistency.py
      - name: Validate persistent trip package
        run: python scripts/check_trip_calendar_package.py
      - name: Lint YAML
        run: yamllint .
      - name: Install Node validators
        run: npm install
      - name: Lint Markdown
        run: npm run markdown:lint
      - name: Check formatting
        run: npm run format:check
      - name: Check direct entity references
        run: python scripts/check_entity_references.py
      - name: Check mapped entity keys
        run: python scripts/check_mapped_entity_keys.py
      - name: Check dashboard render script
        run: |
          python scripts/render_dashboard.py --output build/render-default
          python scripts/render_dashboard.py --output build/render-custom --dashboard-path /kia-ev6
      - name: Check runtime mapping health script
        run: python scripts/check_runtime_mapping_health.py
      - name: Check image references
        run: python scripts/check_image_references.py
