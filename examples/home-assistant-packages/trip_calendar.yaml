---
# Persistent Kia trip logging with Home Assistant's Local Calendar integration.
#
# Before loading this package:
# 1. Add a Local Calendar in Home Assistant.
# 2. Replace every calendar.your_vehicle_trips and every source entity below.
# 3. Replace the primary and secondary driver trackers. The matching detected
#    activity sensors are optional; leave their placeholders unchanged if the
#    Companion app does not expose them.
# 4. Copy this file to /config/packages/trip_calendar.yaml and restart HA.

input_boolean:
  kia_trip_active:
    name: Kia trip active
    icon: mdi:car-connected
  kia_trip_detailed_sampling:
    name: Kia trip detailed sampling
    icon: mdi:car-clock
  kia_trip_use_driver_tracker:
    name: Kia trip driver tracker
    icon: mdi:cellphone-marker

input_datetime:
  kia_trip_started_at:
    name: Kia trip started at
    has_date: true
    has_time: true

input_select:
  kia_trip_route_mode:
    name: Kia trip route mode
    icon: mdi:map-marker-path
    options:
      - Automatic
      - Kia only
      - Primary phone
      - Secondary phone
    initial: Automatic

input_number:
  kia_trip_start_odometer:
    name: Kia trip start odometer
    min: 0
    max: 2000000
    step: 0.1
    mode: box
    unit_of_measurement: km
  kia_trip_start_soc:
    name: Kia trip start battery
    min: 0
    max: 100
    step: 0.1
    mode: box
    unit_of_measurement: "%"
  kia_trip_start_energy:
    name: Kia trip start energy
    min: 0
    max: 1000
    step: 0.001
    mode: box
    unit_of_measurement: kWh

input_text:
  kia_trip_start_location:
    name: Kia trip start location
    max: 255
  kia_trip_start_coordinates:
    name: Kia trip start coordinates
    max: 255
  kia_trip_primary_start_coordinates:
    name: Kia trip primary phone start coordinates
    max: 255
  kia_trip_secondary_start_coordinates:
    name: Kia trip secondary phone start coordinates
    max: 255
  kia_trip_selected_route_tracker:
    name: Kia trip selected route tracker
    max: 255
  kia_trip_route_source:
    name: Kia trip route source
    max: 255
  kia_trip_route_points:
    name: Kia trip route points
    max: 255
  kia_trip_route_points_2:
    name: Kia trip route points 2
    max: 255
  kia_trip_route_points_3:
    name: Kia trip route points 3
    max: 255
  kia_trip_route_points_4:
    name: Kia trip route points 4
    max: 255
  kia_trip_route_points_5:
    name: Kia trip route points 5
    max: 255
  kia_trip_route_points_6:
    name: Kia trip route points 6
    max: 255
  kia_trip_start_driving_stats:
    name: Kia trip start driving stats
    max: 255

automation:
  - id: kia_trip_calendar_capture_start
    alias: Kia trip calendar - capture start
    description: Snapshot vehicle values when Kia reports the engine running.
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.your_vehicle_engine
        to: "on"
    conditions:
      - condition: template
        value_template: >-
          {{ has_value('sensor.your_vehicle_odometer') }}
    actions:
      - variables:
          route_tracker: device_tracker.your_vehicle_location
          start_energy_raw: >-
            {{ states('sensor.your_vehicle_remaining_energy') | float(0) }}
          start_energy_unit: >-
            {{ state_attr('sensor.your_vehicle_remaining_energy',
                          'unit_of_measurement') | default('kWh', true) | lower }}
          start_location: >-
            {% set value = states('device_tracker.your_vehicle_location') %}
            {% set lat = state_attr('device_tracker.your_vehicle_location', 'latitude') %}
            {% set lon = state_attr('device_tracker.your_vehicle_location', 'longitude') %}
            {% if value not in ['unknown', 'unavailable', 'not_home'] %}
              {{ value | replace('_', ' ') | title }}
            {% elif lat is number and lon is number %}
              {{ 'GPS ' ~ (lat | round(4) | string) ~ ', ' ~
                 (lon | round(4) | string) }}
            {% else %}
              Away
            {% endif %}
          start_coordinates: >-
            {% set lat = state_attr(route_tracker, 'latitude') %}
            {% set lon = state_attr(route_tracker, 'longitude') %}
            {{ (lat | round(6) ~ ',' ~ lon | round(6))
               if lat is number and lon is number else '' }}
          primary_start_coordinates: >-
            {% set lat = state_attr('device_tracker.your_driver_phone', 'latitude') %}
            {% set lon = state_attr('device_tracker.your_driver_phone', 'longitude') %}
            {{ (lat | round(6) ~ ',' ~ lon | round(6))
               if lat is number and lon is number else '' }}
          secondary_start_coordinates: >-
            {% set lat = state_attr('device_tracker.your_second_driver_phone', 'latitude') %}
            {% set lon = state_attr('device_tracker.your_second_driver_phone', 'longitude') %}
            {{ (lat | round(6) ~ ',' ~ lon | round(6))
               if lat is number and lon is number else '' }}
          start_driving_stats: >-
            {{ {
              'engine': state_attr('sensor.your_vehicle_today_driving_stats',
                                   'engine_consumption') | float(0),
              'climate': state_attr('sensor.your_vehicle_today_driving_stats',
                                    'climate_consumption') | float(0),
              'electronics': state_attr('sensor.your_vehicle_today_driving_stats',
                                        'onboard_electronics_consumption') | float(0),
              'battery_care': state_attr('sensor.your_vehicle_today_driving_stats',
                                         'battery_care_consumption') | float(0),
              'regenerated': state_attr('sensor.your_vehicle_today_driving_stats',
                                        'regenerated_energy') | float(0)
            } | to_json }}
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.kia_trip_started_at
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.kia_trip_start_odometer
        data:
          value: "{{ states('sensor.your_vehicle_odometer') | float(0) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.kia_trip_start_soc
        data:
          value: "{{ states('sensor.your_vehicle_battery_level') | float(0) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.kia_trip_start_energy
        data:
          value: >-
            {% if start_energy_unit == 'kj' %}
              {{ start_energy_raw / 3600 }}
            {% elif start_energy_unit == 'wh' %}
              {{ start_energy_raw / 1000 }}
            {% else %}
              {{ start_energy_raw }}
            {% endif %}
      - action: input_text.set_value
        target:
          entity_id: input_text.kia_trip_start_location
        data:
          value: "{{ start_location | trim }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.kia_trip_start_coordinates
        data:
          value: "{{ start_coordinates | trim }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.kia_trip_primary_start_coordinates
        data:
          value: "{{ primary_start_coordinates | trim }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.kia_trip_secondary_start_coordinates
        data:
          value: "{{ secondary_start_coordinates | trim }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.kia_trip_selected_route_tracker
        data:
          value: device_tracker.your_vehicle_location
      - action: input_text.set_value
        target:
          entity_id: input_text.kia_trip_route_source
        data:
          value: kia
      - action: input_text.set_value
        target:
          entity_id: input_text.kia_trip_route_points
        data:
          value: "{{ start_coordinates | trim }}"
      - action: input_text.set_value
        target:
          entity_id:
            - input_text.kia_trip_route_points_2
            - input_text.kia_trip_route_points_3
            - input_text.kia_trip_route_points_4
            - input_text.kia_trip_route_points_5
            - input_text.kia_trip_route_points_6
        data:
          value: ""
      - action: input_text.set_value
        target:
          entity_id: input_text.kia_trip_start_driving_stats
        data:
          value: "{{ start_driving_stats }}"
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.kia_trip_active

  - id: kia_trip_calendar_select_route_tracker
    alias: Kia trip calendar - select route tracker
    description: Select a moving driver phone or keep Kia as the route source.
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.your_vehicle_engine
        to: "on"
        id: started
      - trigger: time_pattern
        minutes: "/2"
        id: retry
    actions:
      - if:
          - condition: trigger
            id: started
        then:
          - delay: "00:02:00"
      - condition: state
        entity_id: input_boolean.kia_trip_active
        state: "on"
      - condition: state
        entity_id: binary_sensor.your_vehicle_engine
        state: "on"
      - condition: state
        entity_id: input_text.kia_trip_route_source
        state: kia
      - variables:
          route_mode: "{{ states('input_select.kia_trip_route_mode') | lower }}"
          primary_tracker: device_tracker.your_driver_phone
          secondary_tracker: device_tracker.your_second_driver_phone
          primary_movement_km: >-
            {% macro movement(start_value, tracker) -%}
              {% set parts = start_value.split(',') %}
              {% set lat2 = state_attr(tracker, 'latitude') %}
              {% set lon2 = state_attr(tracker, 'longitude') %}
              {% if parts | length == 2 and lat2 is number and lon2 is number %}
                {% set lat1 = parts[0] | float %}
                {% set lon1 = parts[1] | float %}
                {% set dlat = (lat2 - lat1) * pi / 180 %}
                {% set dlon = (lon2 - lon1) * pi / 180 %}
                {% set value = sin(dlat / 2) ** 2 +
                   cos(lat1 * pi / 180) * cos(lat2 * pi / 180) *
                   sin(dlon / 2) ** 2 %}
                {{ 6371 * 2 * atan2(sqrt(value), sqrt(1 - value)) }}
              {% else %}
                0
              {% endif %}
            {%- endmacro %}
            {{ movement(states('input_text.kia_trip_primary_start_coordinates'),
                        primary_tracker) | float(0) }}
          secondary_movement_km: >-
            {% macro movement(start_value, tracker) -%}
              {% set parts = start_value.split(',') %}
              {% set lat2 = state_attr(tracker, 'latitude') %}
              {% set lon2 = state_attr(tracker, 'longitude') %}
              {% if parts | length == 2 and lat2 is number and lon2 is number %}
                {% set lat1 = parts[0] | float %}
                {% set lon1 = parts[1] | float %}
                {% set dlat = (lat2 - lat1) * pi / 180 %}
                {% set dlon = (lon2 - lon1) * pi / 180 %}
                {% set value = sin(dlat / 2) ** 2 +
                   cos(lat1 * pi / 180) * cos(lat2 * pi / 180) *
                   sin(dlon / 2) ** 2 %}
                {{ 6371 * 2 * atan2(sqrt(value), sqrt(1 - value)) }}
              {% else %}
                0
              {% endif %}
            {%- endmacro %}
            {{ movement(states('input_text.kia_trip_secondary_start_coordinates'),
                        secondary_tracker) | float(0) }}
          primary_activity: >-
            {{ states('sensor.your_driver_phone_detected_activity') | lower }}
          secondary_activity: >-
            {{ states('sensor.your_second_driver_phone_detected_activity') | lower }}
          primary_updated_ts: >-
            {% set tracker_state = expand(primary_tracker) | first %}
            {{ as_timestamp(tracker_state.last_updated, 0)
               if tracker_state is defined else 0 }}
          secondary_updated_ts: >-
            {% set tracker_state = expand(secondary_tracker) | first %}
            {{ as_timestamp(tracker_state.last_updated, 0)
               if tracker_state is defined else 0 }}
      - variables:
          primary_automotive: >-
            {{ primary_activity in ['automotive', 'in_vehicle', 'driving'] }}
          secondary_automotive: >-
            {{ secondary_activity in ['automotive', 'in_vehicle', 'driving'] }}
          primary_recent: >-
            {{ primary_updated_ts | float(0) >=
                 as_timestamp(states('input_datetime.kia_trip_started_at'), 0) and
               as_timestamp(now()) - primary_updated_ts | float(0) <= 300 }}
          secondary_recent: >-
            {{ secondary_updated_ts | float(0) >=
                 as_timestamp(states('input_datetime.kia_trip_started_at'), 0) and
               as_timestamp(now()) - secondary_updated_ts | float(0) <= 300 }}
          primary_candidate: >-
            {{ primary_recent | bool(false) and
               (primary_movement_km | float(0) >= 0.35 or
                (primary_automotive | bool(false) and
                 primary_movement_km | float(0) >= 0.1)) }}
          secondary_candidate: >-
            {{ secondary_recent | bool(false) and
               (secondary_movement_km | float(0) >= 0.35 or
                (secondary_automotive | bool(false) and
                 secondary_movement_km | float(0) >= 0.1)) }}
          primary_score: >-
            {{ primary_movement_km | float(0) +
               (5 if primary_automotive | bool(false) else 0) }}
          secondary_score: >-
            {{ secondary_movement_km | float(0) +
               (5 if secondary_automotive | bool(false) else 0) }}
      - variables:
          selected_tracker: >-
            {% if not is_state('input_boolean.kia_trip_use_driver_tracker', 'on') or
                  route_mode == 'kia only' %}
              device_tracker.your_vehicle_location
            {% elif route_mode == 'primary phone' %}
              {{ primary_tracker
                 if state_attr(primary_tracker, 'latitude') is number and
                    state_attr(primary_tracker, 'longitude') is number
                 else 'device_tracker.your_vehicle_location' }}
            {% elif route_mode == 'secondary phone' %}
              {{ secondary_tracker
                 if state_attr(secondary_tracker, 'latitude') is number and
                    state_attr(secondary_tracker, 'longitude') is number
                 else 'device_tracker.your_vehicle_location' }}
            {% elif primary_candidate | bool(false) and
                    (not secondary_candidate | bool(false) or
                     primary_score | float(0) >= secondary_score | float(0)) %}
              {{ primary_tracker }}
            {% elif secondary_candidate | bool(false) %}
              {{ secondary_tracker }}
            {% else %}
              device_tracker.your_vehicle_location
            {% endif %}
          selected_source: >-
            {% if selected_tracker | trim == primary_tracker %}
              phone-primary
            {% elif selected_tracker | trim == secondary_tracker %}
              phone-secondary
            {% else %}
              kia
            {% endif %}
      - action: input_text.set_value
        target:
          entity_id: input_text.kia_trip_selected_route_tracker
        data:
          value: "{{ selected_tracker | trim }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.kia_trip_route_source
        data:
          value: "{{ selected_source | trim }}"

  - id: kia_trip_calendar_capture_route
    alias: Kia trip calendar - capture route points
    description: Preserve vehicle or opted-in driver-phone points while a trip is active.
    mode: queued
    max: 3
    triggers:
      - trigger: state
        entity_id: device_tracker.your_vehicle_location
      - trigger: time_pattern
        minutes: "/1"
    conditions:
      - condition: state
        entity_id: input_boolean.kia_trip_active
        state: "on"
    actions:
      - variables:
          route_tracker: >-
            {% set selected = states('input_text.kia_trip_selected_route_tracker') %}
            {% set selected_phone = selected in
               ['device_tracker.your_driver_phone',
                'device_tracker.your_second_driver_phone'] %}
            {{ selected
               if state_attr(selected, 'latitude') is number and
                  state_attr(selected, 'longitude') is number and
                  (not selected_phone or
                   is_state('input_boolean.kia_trip_use_driver_tracker', 'on'))
               else 'device_tracker.your_vehicle_location' }}
          route_point: >-
            {% set lat = state_attr(route_tracker, 'latitude') %}
            {% set lon = state_attr(route_tracker, 'longitude') %}
            {{ (lat | round(5) ~ ',' ~ lon | round(5))
               if lat is number and lon is number else '' }}
          route_helpers:
            - input_text.kia_trip_route_points
            - input_text.kia_trip_route_points_2
            - input_text.kia_trip_route_points_3
            - input_text.kia_trip_route_points_4
            - input_text.kia_trip_route_points_5
            - input_text.kia_trip_route_points_6
          route_points: >-
            {{ [states('input_text.kia_trip_route_points'),
                states('input_text.kia_trip_route_points_2'),
                states('input_text.kia_trip_route_points_3'),
                states('input_text.kia_trip_route_points_4'),
                states('input_text.kia_trip_route_points_5'),
                states('input_text.kia_trip_route_points_6')] | join(';') }}
          target_route_helper: >-
            {% set ns = namespace(entity='') %}
            {% for entity_id in route_helpers if ns.entity | length == 0 %}
              {% set segment = states(entity_id) %}
              {% if (segment | length + route_point | length +
                      (1 if segment | length > 0 else 0)) <= 255 %}
                {% set ns.entity = entity_id %}
              {% endif %}
            {% endfor %}
            {{ ns.entity }}
      - condition: template
        value_template: >-
          {{ route_point | length > 0 and
             route_point not in route_points.split(';') and
             target_route_helper | length > 0 }}
      - action: input_text.set_value
        target:
          entity_id: "{{ target_route_helper }}"
        data:
          value: >-
            {% set segment = states(target_route_helper) %}
            {{ segment ~ (';' if segment | length > 0 else '') ~ route_point }}

  - id: kia_trip_calendar_detailed_sampling
    alias: Kia trip calendar - detailed active sampling
    description: Optionally refresh Kia every five minutes during an active trip.
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/5"
    conditions:
      - condition: state
        entity_id: input_boolean.kia_trip_detailed_sampling
        state: "on"
      - condition: state
        entity_id: input_boolean.kia_trip_active
        state: "on"
      - condition: state
        entity_id: binary_sensor.your_vehicle_engine
        state: "on"
    actions:
      - action: button.press
        target:
          entity_id: button.your_vehicle_force_refresh

  - id: kia_trip_calendar_store_completed
    alias: Kia trip calendar - store completed trip
    description: Store a completed Kia trip as a versioned Local Calendar event.
    mode: queued
    max: 3
    triggers:
      - trigger: state
        entity_id: binary_sensor.your_vehicle_engine
        to: "off"
        id: stopped
      - trigger: homeassistant
        event: start
        id: recovery
    conditions:
      - condition: state
        entity_id: input_boolean.kia_trip_active
        state: "on"
      - condition: state
        entity_id: binary_sensor.your_vehicle_engine
        state: "off"
    actions:
      - if:
          - condition: trigger
            id: recovery
        then:
          - delay: "00:01:00"
        else:
          - wait_for_trigger:
              - trigger: state
                entity_id: sensor.your_vehicle_odometer
            timeout: "00:05:00"
            continue_on_timeout: true
      - condition: state
        entity_id: binary_sensor.your_vehicle_engine
        state: "off"
      - variables:
          trip_start_ts: >-
            {{ as_timestamp(states('input_datetime.kia_trip_started_at'), 0) }}
          trip_end_ts: >-
            {{ as_timestamp(trigger.to_state.last_changed)
               if trigger.id == 'stopped' else as_timestamp(now()) }}
          start_odometer: >-
            {{ states('input_number.kia_trip_start_odometer') | float(0) }}
          end_odometer: >-
            {{ states('sensor.your_vehicle_odometer') | float(0) }}
          soc_start: >-
            {{ states('input_number.kia_trip_start_soc') | float(0) }}
          soc_end: >-
            {{ states('sensor.your_vehicle_battery_level') | float(0) }}
          energy_start: >-
            {{ states('input_number.kia_trip_start_energy') | float(0) }}
          energy_end_raw: >-
            {{ states('sensor.your_vehicle_remaining_energy') | float(0) }}
          energy_end_unit: >-
            {{ state_attr('sensor.your_vehicle_remaining_energy',
                          'unit_of_measurement') | default('kWh', true) | lower }}
          start_driving_stats: >-
            {{ states('input_text.kia_trip_start_driving_stats') | from_json({}) }}
          same_driving_day: >-
            {{ trip_start_ts | timestamp_custom('%Y-%m-%d', true) ==
               trip_end_ts | timestamp_custom('%Y-%m-%d', true) }}
          destination: >-
            {% set value = states('device_tracker.your_vehicle_location') %}
            {% set lat = state_attr('device_tracker.your_vehicle_location', 'latitude') %}
            {% set lon = state_attr('device_tracker.your_vehicle_location', 'longitude') %}
            {% if value not in ['unknown', 'unavailable', 'not_home'] %}
              {{ value | replace('_', ' ') | title }}
            {% elif lat is number and lon is number %}
              {{ 'GPS ' ~ (lat | round(4) | string) ~ ', ' ~
                 (lon | round(4) | string) }}
            {% else %}
              Away
            {% endif %}
      - variables:
          distance: "{{ [end_odometer - start_odometer, 0] | max }}"
          duration_minutes: >-
            {{ [((trip_end_ts - trip_start_ts) / 60) | round(0) | int, 1] | max }}
          energy_end: >-
            {% if energy_end_unit == 'kj' %}
              {{ energy_end_raw / 3600 }}
            {% elif energy_end_unit == 'wh' %}
              {{ energy_end_raw / 1000 }}
            {% else %}
              {{ energy_end_raw }}
            {% endif %}
      - variables:
          energy_used: "{{ [energy_start - energy_end, 0] | max }}"
          consumption: >-
            {{ ((energy_start - energy_end) / distance * 100)
               if distance | float(0) > 0 and energy_start > energy_end else 0 }}
          average_speed: >-
            {{ (distance / (duration_minutes / 60))
               if duration_minutes | float(0) > 0 else 0 }}
          trip_id: "kia-{{ trip_start_ts | int }}"
          drive_energy: >-
            {{ ([state_attr('sensor.your_vehicle_today_driving_stats',
                            'engine_consumption') | float(0) -
                   start_driving_stats.get('engine', 0) | float(0), 0] | max / 1000)
               if same_driving_day else none }}
          climate_energy: >-
            {{ ([state_attr('sensor.your_vehicle_today_driving_stats',
                            'climate_consumption') | float(0) -
                   start_driving_stats.get('climate', 0) | float(0), 0] | max / 1000)
               if same_driving_day else none }}
          electronics_energy: >-
            {{ ([state_attr('sensor.your_vehicle_today_driving_stats',
                            'onboard_electronics_consumption') | float(0) -
                   start_driving_stats.get('electronics', 0) | float(0), 0] | max / 1000)
               if same_driving_day else none }}
          battery_care_energy: >-
            {{ ([state_attr('sensor.your_vehicle_today_driving_stats',
                            'battery_care_consumption') | float(0) -
                   start_driving_stats.get('battery_care', 0) | float(0), 0] | max / 1000)
               if same_driving_day else none }}
          regenerated_energy: >-
            {{ ([state_attr('sensor.your_vehicle_today_driving_stats',
                            'regenerated_energy') | float(0) -
                   start_driving_stats.get('regenerated', 0) | float(0), 0] | max / 1000)
               if same_driving_day else none }}
      - if:
          - condition: template
            value_template: "{{ distance | float(0) >= 0.2 }}"
        then:
          - action: calendar.get_events
            continue_on_error: true
            target:
              entity_id: calendar.your_vehicle_trips
            data:
              start_date_time: >-
                {{ trip_start_ts | timestamp_custom('%Y-%m-%d %H:%M:%S', true) }}
              end_date_time: >-
                {{ (trip_end_ts + 1) |
                   timestamp_custom('%Y-%m-%d %H:%M:%S', true) }}
            response_variable: existing_trips
          - variables:
              duplicate_trip: >-
                {% set ns = namespace(found=false) %}
                {% set response = existing_trips | default({}) %}
                {% set calendar_events =
                   response.get('calendar.your_vehicle_trips', {}).get('events', []) %}
                {% for event in calendar_events %}
                  {% if trip_id in (event.description | default('')) %}
                    {% set ns.found = true %}
                  {% endif %}
                {% endfor %}
                {{ ns.found }}
          - if:
              - condition: template
                value_template: "{{ not duplicate_trip }}"
            then:
              - action: calendar.create_event
                continue_on_error: true
                target:
                  entity_id: calendar.your_vehicle_trips
                data:
                  summary: >-
                    {{ states('input_text.kia_trip_start_location') | trim }}
                    to {{ destination | string | trim }} -
                    {{ distance | float(0) | round(1) }} km
                  start_date_time: >-
                    {{ trip_start_ts |
                       timestamp_custom('%Y-%m-%d %H:%M:%S', true) }}
                  end_date_time: >-
                    {{ trip_end_ts |
                       timestamp_custom('%Y-%m-%d %H:%M:%S', true) }}
                  location: "{{ destination | string | trim }}"
                  description: >-
                    {% set selected =
                       states('input_text.kia_trip_selected_route_tracker') %}
                    {% set route_tracker = selected
                       if state_attr(selected, 'latitude') is number
                       else 'device_tracker.your_vehicle_location' %}
                    {% set destination_lat = state_attr(route_tracker, 'latitude') %}
                    {% set destination_lon = state_attr(route_tracker, 'longitude') %}
                    {{ {
                      'schema': 'kia_trip_v2',
                      'trip_id': trip_id,
                      'origin': states('input_text.kia_trip_start_location') | trim,
                      'destination': destination | string | trim,
                      'origin_coordinates':
                        states('input_text.kia_trip_start_coordinates') | trim,
                      'destination_coordinates':
                        ((destination_lat | string) ~ ',' ~
                         (destination_lon | string))
                        if destination_lat is number and destination_lon is number
                        else '',
                      'route_source': states('input_text.kia_trip_route_source'),
                      'route_points':
                        ([states('input_text.kia_trip_route_points'),
                          states('input_text.kia_trip_route_points_2'),
                          states('input_text.kia_trip_route_points_3'),
                          states('input_text.kia_trip_route_points_4'),
                          states('input_text.kia_trip_route_points_5'),
                          states('input_text.kia_trip_route_points_6')] |
                         join(';')).split(';') |
                        reject('equalto', '') | list,
                      'odometer_start': start_odometer | float(0) | round(1),
                      'odometer_end': end_odometer | float(0) | round(1),
                      'distance_km': distance | float(0) | round(3),
                      'duration_minutes': duration_minutes | int,
                      'soc_start': soc_start | float(0) | round(1),
                      'soc_end': soc_end | float(0) | round(1),
                      'energy_kwh': energy_used | float(0) | round(3),
                      'consumption_kwh_100km': consumption | float(0) | round(2),
                      'average_speed_kmh': average_speed | float(0) | round(1),
                      'drive_energy_kwh': drive_energy | round(3)
                        if drive_energy is number else none,
                      'climate_energy_kwh': climate_energy | round(3)
                        if climate_energy is number else none,
                      'electronics_energy_kwh': electronics_energy | round(3)
                        if electronics_energy is number else none,
                      'battery_care_energy_kwh': battery_care_energy | round(3)
                        if battery_care_energy is number else none,
                      'regenerated_energy_kwh': regenerated_energy | round(3)
                        if regenerated_energy is number else none
                    } | to_json }}
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.kia_trip_active
